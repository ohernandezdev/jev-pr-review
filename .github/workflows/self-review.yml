name: self-review

# Dogfood: this repo reviews its own pull requests in shadow mode.
# `pull_request`, never `pull_request_target` -- the job holds a write token
# and must never run a fork's code.
on: pull_request

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          pr-number: ${{ github.event.pull_request.number }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
